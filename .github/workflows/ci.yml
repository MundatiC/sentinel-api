name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # least privilege for the workflow token

jobs:
  test:
    runs-on: ubuntu-latest
    # Integration tests run against a real PostgreSQL, started as a service container.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sentinel"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://sentinel:sentinel@localhost:5432/sentinel_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx prisma validate
      - run: npm run build
      - run: npx prisma migrate deploy
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sentinel-api .
